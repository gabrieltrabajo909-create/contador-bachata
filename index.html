<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cuentas · Bachata y Salsa</title>
<style>
  :root {
    --ground: #0e0d12;
    --ink: #f4f2f7;
    --muted: #8b8599;
    --dim: #5d5870;
    --accent: #ff5a36;
    --accent2: #3ecf8e;
    --line: #262330;
    --card: #17151d;
    --card2: #1f1c28;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    -webkit-user-select: none;
    user-select: none;
  }

  .wrap { max-width: 32rem; margin: 0 auto; padding: 14px 14px 40px; }

  /* ---------- Pestañas ---------- */
  .tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 5px;
    margin-bottom: 18px;
  }

  .tabs button {
    border: none;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-weight: 600;
    padding: 11px;
    border-radius: 999px;
    cursor: pointer;
  }

  .tabs button[aria-selected="true"] {
    background: var(--accent);
    color: #fff;
  }

  /* ---------- Selector de idioma ---------- */
  .topbar { display: flex; justify-content: flex-end; margin-bottom: 8px; }
  .langsw {
    display: flex; gap: 2px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 999px; padding: 3px;
  }
  .langsw button {
    border: none; background: transparent; color: var(--dim);
    font: inherit; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em;
    padding: 5px 11px; border-radius: 999px; cursor: pointer;
  }
  .langsw button[aria-pressed="true"] { background: var(--card2); color: var(--ink); }

  .panel[hidden] { display: none; }

  /* ---------- Bloques ---------- */
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 12px;
  }

  .card h2 {
    font-size: 0.72rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 12px;
    font-weight: 600;
  }

  label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 5px; }

  input[type=text] {
    width: 100%;
    font: inherit;
    background: var(--card2);
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 10px;
    padding: 11px 13px;
    margin-bottom: 11px;
    -webkit-user-select: text;
    user-select: text;
  }

  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  .seg { display: flex; gap: 6px; margin-bottom: 12px; }

  .seg button {
    flex: 1;
    font: inherit;
    font-weight: 600;
    padding: 11px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--card2);
    color: var(--muted);
    cursor: pointer;
  }

  .seg button[aria-pressed="true"] {
    border-color: var(--accent);
    color: var(--accent);
  }

  button.primary, button.ghost, button.danger {
    width: 100%;
    font: inherit;
    font-weight: 600;
    border: none;
    border-radius: 999px;
    padding: 15px;
    cursor: pointer;
    margin-bottom: 8px;
  }

  button.primary { background: var(--accent); color: #fff; }
  button.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); }
  button.danger { background: transparent; border: 1px solid #6b2a22; color: #ff8a70; }
  button:disabled { opacity: 0.35; cursor: default; }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .row { display: flex; gap: 8px; }
  .row > button { margin-bottom: 8px; }

  /* ---------- Zona de golpe ---------- */
  .tapzone {
    width: 100%;
    aspect-ratio: 1.5;
    border-radius: 20px;
    border: 2px dashed var(--line);
    background: var(--card);
    color: var(--muted);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font: inherit;
    font-weight: 600;
    font-size: 1.1rem;
    cursor: pointer;
    margin-bottom: 10px;
    transition: background 0.06s linear, border-color 0.06s linear;
  }

  .tapzone.armed { border-color: var(--accent); border-style: solid; color: var(--accent); }
  .tapzone.hit { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tapzone small { font-weight: 500; font-size: 0.78rem; color: var(--dim); }
  .tapzone.hit small { color: rgba(255,255,255,0.8); }

  /* ---------- Contador ---------- */
  .display {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 22px;
    text-align: center;
    margin-bottom: 12px;
  }

  .big {
    font-size: 5rem;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.04em;
    font-variant-numeric: tabular-nums;
    min-height: 5rem;
  }

  .big.one { color: var(--accent); }
  .big.tap { color: var(--accent2); font-size: 3.4rem; letter-spacing: 0; }

  .sub { font-size: 0.8rem; color: var(--muted); margin-top: 8px; min-height: 1.2em; }

  .beats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; }

  .beat {
    aspect-ratio: 1.4;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--card);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    color: var(--dim);
    font-variant-numeric: tabular-nums;
  }

  .beat.on { background: #2a2536; color: var(--ink); }
  .beat.on.one { background: var(--accent); border-color: var(--accent); color: #fff; }
  .beat.on.tapb { background: var(--accent2); border-color: var(--accent2); color: #04140d; }

  /* ---------- Medidores ---------- */
  .meter { height: 4px; background: var(--line); border-radius: 999px; overflow: hidden; margin-bottom: 10px; }
  .meter > i { display: block; height: 100%; width: 0%; background: var(--accent2); }

  /* ---------- Lista ---------- */
  .song {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 0;
    border-bottom: 1px solid var(--line);
  }

  .song:last-child { border-bottom: none; }
  .song .info { flex: 1; min-width: 0; }
  .song .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .song .m { font-size: 0.76rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .song button {
    border: 1px solid var(--line);
    background: var(--card2);
    color: var(--muted);
    border-radius: 8px;
    padding: 7px 11px;
    font: inherit;
    font-size: 0.8rem;
    cursor: pointer;
  }

  .pill {
    display: inline-block;
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 999px;
    background: var(--card2);
    color: var(--muted);
    border: 1px solid var(--line);
  }

  /* ---------- Juego ---------- */
  .verdict {
    font-size: 3.2rem;
    font-weight: 750;
    line-height: 1.1;
    letter-spacing: -0.03em;
    min-height: 3.5rem;
    color: var(--dim);
    transition: color 0.08s linear, transform 0.08s ease;
  }
  .verdict.perfecto { color: var(--accent2); }
  .verdict.bien     { color: #8fd98f; }
  .verdict.casi     { color: #ffc94d; }
  .verdict.fuera    { color: #ff7a5c; }
  .verdict.pop      { transform: scale(1.08); }

  .offby { font-size: 0.85rem; color: var(--muted); min-height: 1.3em; }

  .scoreline {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 10px;
  }
  .scoreline > div {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 6px;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .sv { font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
  .sk { font-size: 0.66rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); }

  .grade {
    font-size: 2rem;
    font-weight: 750;
    letter-spacing: -0.02em;
    text-align: center;
    margin-bottom: 14px;
    color: var(--accent2);
  }

  .resgrid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 6px;
  }
  .resgrid > div {
    background: var(--card2);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .rv { font-size: 1.35rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
  .rk { font-size: 0.66rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); }

  .scorerow {
    display: flex; justify-content: space-between; gap: 10px;
    padding: 10px 0; border-bottom: 1px solid var(--line);
    font-size: 0.85rem;
  }
  .scorerow:last-child { border-bottom: none; }
  .scorerow .t { color: var(--ink); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .scorerow .d { color: var(--dim); font-size: 0.76rem; }
  .scorerow .p { color: var(--accent2); font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }

  .status { font-size: 0.82rem; color: var(--muted); line-height: 1.5; text-align: center; min-height: 2.4em; padding: 0 4px; }
  .status.err { color: #ff8a70; }
  .status.ok { color: var(--accent2); }

  .empty { color: var(--dim); font-size: 0.85rem; text-align: center; padding: 14px 0; }

  .taplist { max-height: 140px; overflow-y: auto; font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .taplist div { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid var(--line); }
  .taplist button { background: none; border: none; color: #ff8a70; cursor: pointer; font: inherit; padding: 0 4px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="langsw" id="langsw">
      <button data-lang="es" aria-pressed="true">ES</button>
      <button data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>

  <div class="tabs" role="tablist">
    <button role="tab" id="tab-prof" aria-selected="true" aria-controls="panel-prof" data-i18n="tabProf">Profesor</button>
    <button role="tab" id="tab-alum" aria-selected="false" aria-controls="panel-alum" data-i18n="tabAlum">Alumno</button>
  </div>

  <!-- ============ PROFESOR ============ -->
  <section class="panel" id="panel-prof" role="tabpanel">

    <div class="card" id="p-setup">
      <h2 data-i18n="newSong">Nueva canción</h2>
      <label for="f-title" data-i18n="song">Canción</label>
      <input type="text" id="f-title" placeholder="Propuesta indecente" data-i18n-ph="phSong">
      <label for="f-artist" data-i18n="artist">Artista</label>
      <input type="text" id="f-artist" placeholder="Romeo Santos" data-i18n-ph="phArtist">
      <label for="f-teacher" data-i18n="teacher">Profesor</label>
      <input type="text" id="f-teacher" placeholder="Tu nombre" data-i18n-ph="phTeacher">
      <label data-i18n="rhythm">Ritmo</label>
      <div class="seg" id="f-rhythm">
        <button data-r="bachata" aria-pressed="true" data-i18n="bachata">Bachata</button>
        <button data-r="salsa1" aria-pressed="false" data-i18n="salsa1">Salsa en 1</button>
      </div>
      <button class="primary" id="p-start" data-i18n="startRec">Empezar a grabar</button>
    </div>

    <div class="card" id="p-rec" hidden>
      <h2 data-i18n="recording">Grabando</h2>
      <div class="meter"><i id="p-level"></i></div>
      <button class="tapzone" id="p-tap">
        <span id="p-tapmain" data-i18n="tapOne">Toca en cada UNO</span>
        <small id="p-taphint" data-i18n="tapHint">Empieza cuando entre el 1 de la canción</small>
      </button>
      <div class="row">
        <button class="ghost" id="p-undo" data-i18n="undo">Borrar último</button>
        <button class="primary" id="p-stop" data-i18n="finish">Terminar</button>
      </div>
      <p class="status" id="p-status"></p>
    </div>

    <div class="card" id="p-review" hidden>
      <h2 data-i18n="review">Revisar antes de guardar</h2>
      <p class="status" id="p-revinfo"></p>
      <label data-i18n="nudgeLabel">Ajuste fino de todas las cuentas</label>
      <div class="row">
        <button class="ghost" id="p-nudge-b">−50 ms</button>
        <button class="ghost" id="p-nudge-f">+50 ms</button>
      </div>
      <label style="margin-top:6px" data-i18n="tapsMarked">Golpes marcados</label>
      <div class="taplist" id="p-taplist"></div>
      <button class="primary" id="p-save" style="margin-top:12px" data-i18n="save">Guardar canción</button>
      <button class="danger" id="p-discard" data-i18n="discard">Descartar</button>
    </div>

    <div class="card">
      <h2 data-i18n="savedSongs">Canciones guardadas</h2>
      <div id="p-list"></div>
      <div class="row" style="margin-top:10px">
        <button class="ghost" id="p-export" data-i18n="exportBtn">Exportar</button>
        <button class="ghost" id="p-import" data-i18n="importBtn">Importar</button>
      </div>
      <input type="file" id="p-file" accept="application/json" hidden>
    </div>
  </section>

  <!-- ============ ALUMNO ============ -->
  <section class="panel" id="panel-alum" role="tabpanel" hidden>

    <div class="seg" id="a-mode">
      <button data-m="guia" aria-pressed="true" data-i18n="seeCount">Ver la cuenta</button>
      <button data-m="juego" aria-pressed="false" data-i18n="practise">Practicar</button>
    </div>

    <!-- --- Modo guía: muestra la cuenta --- -->
    <div id="a-guide">
      <div class="display">
        <div class="big" id="a-big">·</div>
        <div class="sub" id="a-sub" data-i18n="notListening">Sin escuchar</div>
      </div>
      <div class="beats" id="a-beats"></div>
    </div>

    <!-- --- Modo juego: la cuenta queda oculta --- -->
    <div id="a-game" hidden>
      <div class="display">
        <div class="verdict" id="g-verdict">—</div>
        <div class="offby" id="g-offby" data-i18n="gameHint">Toca en cada UNO. No te voy a mostrar dónde está.</div>
      </div>

      <button class="tapzone" id="g-tap">
        <span id="g-tapmain" data-i18n="gameTap">Toca en el UNO</span>
        <small id="g-taphint" data-i18n="gameTapHint">Escuchá el compás y marcá</small>
      </button>

      <div class="scoreline">
        <div><span class="sv" id="g-points">0</span><span class="sk" data-i18n="points">puntos</span></div>
        <div><span class="sv" id="g-hits">0</span><span class="sk" data-i18n="hits">aciertos</span></div>
        <div><span class="sv" id="g-streak">0</span><span class="sk" data-i18n="streak">seguidos</span></div>
      </div>

      <button class="primary" id="g-finish" disabled data-i18n="finishGame">Terminar y ver resultado</button>

      <!-- Resultado final -->
      <div class="card" id="g-result" hidden>
        <h2 data-i18n="result">Resultado</h2>
        <div class="grade" id="g-grade">—</div>
        <div class="resgrid">
          <div><span class="rv" id="r-points">0</span><span class="rk" data-i18n="points">puntos</span></div>
          <div><span class="rv" id="r-acc">0%</span><span class="rk" data-i18n="accuracy">precisión</span></div>
          <div><span class="rv" id="r-err">0 ms</span><span class="rk" data-i18n="avgErr">error medio</span></div>
          <div><span class="rv" id="r-streak">0</span><span class="rk" data-i18n="bestStreak">mejor racha</span></div>
        </div>
        <p class="status" id="r-tip"></p>
        <button class="ghost" id="g-again" data-i18n="again">Otra vez</button>
      </div>
    </div>

    <div class="card">
      <div class="meter"><i id="a-level"></i></div>
      <button class="primary" id="a-start" data-i18n="listen">Escuchar y reconocer</button>
      <button class="ghost" id="a-stop" disabled data-i18n="stop">Parar</button>
      <div class="row">
        <button class="ghost" id="a-voice">Voz: no</button>
        <button class="ghost" id="a-vibe">Vibrar: sí</button>
      </div>
      <p class="status" id="a-status" data-i18n="startHint">Pon la canción y dale a escuchar.</p>
    </div>

    <div class="card">
      <h2 data-i18n="repertoire">Repertorio</h2>
      <div id="a-list"></div>
    </div>

    <div class="card">
      <h2 data-i18n="yourScores">Tus puntajes</h2>
      <div id="a-scores"></div>
    </div>
  </section>

</div>

<script>

/* =========================================================================
   Huella de audio (constelación de picos, estilo landmark)

   El espectro se muestrea a intervalo fijo. En cada frame se toman los picos
   más fuertes por bandas; cada pico se empareja con picos de frames
   posteriores y el par se empaqueta en un entero de 32 bits. La misma
   canción produce los mismos hashes, así que comparando los desfases entre
   los hashes guardados y los que se oyen ahora se sabe qué canción es y en
   qué segundo va.
   ========================================================================= */
const FP = {
  // Si algún día cambia cómo se calculan las huellas, sube este número.
  // Las canciones guardadas con otra versión no se pueden comparar con las
  // nuevas, así que la app las detecta y avisa en vez de fallar en silencio.
  VERSION: 1,
  FFT: 2048,
  HOP: 0.0464,        // segundos por frame (~21.6 frames/s)
  MAXBIN: 232,        // ~5 kHz con 44.1 kHz
  BANDS: [4, 12, 24, 48, 96, 160, 232],
  PEAKS: 3,                    // picos por frame
  DTS: [3, 6, 10, 15, 21],     // separaciones (en frames) a las que se empareja
  DTMAX: 21,
  PAIR: 2                      // picos del ancla × picos del objetivo
};

function packHash(f1, f2, dt) {
  // f1,f2 en 0..255 (bin >> 1 para que quepan), dt en 0..31
  return (((f1 & 255) << 13) | ((f2 & 255) << 5) | (dt & 31)) >>> 0;
}

class Fingerprinter {
  constructor() {
    this.N = FP.DTMAX + 1;
    this.ring = new Array(this.N);   // últimos N frames de picos
    this.keys = [];
    this.times = [];
  }

  // spectrum: Float32Array en dB. frame: índice entero de frame.
  push(spectrum, frame) {
    const peaks = this.pickPeaks(spectrum);
    this.ring[frame % this.N] = { frame, peaks };

    // Emparejar con los frames ancla a distancias fijas. Acotar el número de
    // pares es lo que mantiene la huella manejable en un teléfono.
    for (const dt of FP.DTS) {
      const prev = this.ring[(frame - dt + this.N * 2) % this.N];
      if (!prev || prev.frame !== frame - dt) continue;
      const na = Math.min(FP.PAIR, prev.peaks.length);
      const nb = Math.min(FP.PAIR, peaks.length);
      for (let i = 0; i < na; i++) {
        for (let j = 0; j < nb; j++) {
          const a = prev.peaks[i], b = peaks[j];
          if (Math.abs(a - b) > 110) continue;
          this.keys.push(packHash(a >> 1, b >> 1, dt));
          this.times.push(prev.frame);
        }
      }
    }
  }

  pickPeaks(spec) {
    const found = [];
    for (let b = 0; b < FP.BANDS.length - 1; b++) {
      const lo = FP.BANDS[b], hi = FP.BANDS[b + 1];
      let best = -Infinity, bestI = -1;
      for (let i = lo; i < hi && i < FP.MAXBIN; i++) {
        if (spec[i] > best) { best = spec[i]; bestI = i; }
      }
      if (bestI >= 0 && best > -85) found.push({ i: bestI, v: best });
    }
    found.sort((x, y) => y.v - x.v);
    return found.slice(0, FP.PEAKS).map(p => p.i);
  }

  result() {
    return { keys: Uint32Array.from(this.keys), times: Uint16Array.from(this.times) };
  }
}

/* ---- Índice en memoria para reconocer ---- */
class Matcher {
  constructor() { this.index = new Map(); this.songs = new Map(); }

  add(song) {
    this.songs.set(song.id, song);
    const { keys, times } = song.fp;
    for (let i = 0; i < keys.length; i++) {
      const k = keys[i];
      let list = this.index.get(k);
      if (!list) { list = []; this.index.set(k, list); }
      list.push(song.id, times[i]);   // plano para ahorrar memoria
    }
  }

  remove(id) {
    this.songs.delete(id);
    for (const [k, list] of this.index) {
      for (let i = list.length - 2; i >= 0; i -= 2) {
        if (list[i] === id) list.splice(i, 2);
      }
      if (!list.length) this.index.delete(k);
    }
  }

  clear() { this.index.clear(); this.songs.clear(); }

  /* Devuelve {songId, offsetFrames, score} o null.
     offsetFrames = frame de la canción guardada que corresponde
     al frame 0 de la consulta. */
  match(keys, times) {
    const votes = new Map();   // songId -> Map(delta -> count)
    for (let i = 0; i < keys.length; i++) {
      const list = this.index.get(keys[i]);
      if (!list) continue;
      for (let j = 0; j < list.length; j += 2) {
        const id = list[j], delta = list[j + 1] - times[i];
        let m = votes.get(id);
        if (!m) { m = new Map(); votes.set(id, m); }
        m.set(delta, (m.get(delta) || 0) + 1);
      }
    }

    let best = null;
    for (const [id, m] of votes) {
      for (const [delta, n] of m) {
        // sumar bins vecinos: el desfase real puede repartirse en ±1 frame
        const score = n + (m.get(delta - 1) || 0) + (m.get(delta + 1) || 0);
        if (!best || score > best.score) best = { songId: id, offsetFrames: delta, score };
      }
    }
    return best && best.score >= 12 ? best : null;
  }
}

/* =========================================================================
   Captura de audio compartida
   ========================================================================= */
class Listener {
  constructor() { this.ctx = null; this.stream = null; this.analyser = null; this.running = false; }

  async start(onFrame, onLevel) {
    this.stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (this.ctx.state === "suspended") await this.ctx.resume();

    const src = this.ctx.createMediaStreamSource(this.stream);
    this.analyser = this.ctx.createAnalyser();
    this.analyser.fftSize = FP.FFT;
    this.analyser.smoothingTimeConstant = 0;
    src.connect(this.analyser);

    this.spec = new Float32Array(this.analyser.frequencyBinCount);
    this.t0 = this.ctx.currentTime;
    this.frame = -1;
    this.running = true;

    const tick = () => {
      if (!this.running) return;
      requestAnimationFrame(tick);
      const elapsed = this.ctx.currentTime - this.t0;
      const f = Math.floor(elapsed / FP.HOP);
      if (f === this.frame) return;
      this.frame = f;
      this.analyser.getFloatFrequencyData(this.spec);
      let e = 0;
      for (let i = 2; i < 80; i++) e += Math.max(0, this.spec[i] + 100);
      if (onLevel) onLevel(Math.min(1, e / 2200));
      onFrame(this.spec, f, elapsed);
    };
    requestAnimationFrame(tick);
  }

  get time() { return this.ctx ? this.ctx.currentTime - this.t0 : 0; }

  stop() {
    this.running = false;
    if (this.stream) this.stream.getTracks().forEach(t => t.stop());
    if (this.ctx) this.ctx.close();
    this.ctx = null; this.stream = null;
  }
}

/* =========================================================================
   Almacenamiento (IndexedDB)
   ========================================================================= */
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open("cuentas", 2);
      r.onupgradeneeded = () => {
        const db = r.result;
        // Crear solo lo que falte: quien ya tenía canciones guardadas no las pierde.
        if (!db.objectStoreNames.contains("songs")) db.createObjectStore("songs", { keyPath: "id" });
        if (!db.objectStoreNames.contains("scores")) db.createObjectStore("scores", { keyPath: "id" });
      };
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  tx(store, mode) { return this.db.transaction(store, mode).objectStore(store); },
  all(store) {
    return new Promise((res, rej) => {
      const r = this.tx(store || "songs", "readonly").getAll();
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  },
  put(item, store) {
    return new Promise((res, rej) => {
      const r = this.tx(store || "songs", "readwrite").put(item);
      r.onsuccess = () => res();
      r.onerror = () => rej(r.error);
    });
  },
  del(id, store) {
    return new Promise((res, rej) => {
      const r = this.tx(store || "songs", "readwrite").delete(id);
      r.onsuccess = () => res();
      r.onerror = () => rej(r.error);
    });
  }
};

/* =========================================================================
   Cuentas a partir de los golpes del profesor

   downbeats = tiempos (s) en los que el profesor marcó el "1".
   Entre dos golpes consecutivos hay 8 cuentas repartidas por igual.
   ========================================================================= */
function countAt(downbeats, t) {
  if (downbeats.length < 2) return null;
  let i = 0;
  while (i < downbeats.length - 2 && downbeats[i + 1] <= t) i++;
  // fuera del rango marcado: extrapolar con el compás más cercano
  let a = downbeats[i], b = downbeats[i + 1];
  if (t < downbeats[0]) { a = downbeats[0]; b = downbeats[1]; }
  else if (t >= downbeats[downbeats.length - 1]) {
    const n = downbeats.length;
    a = downbeats[n - 2]; b = downbeats[n - 1];
    const per = b - a;
    const k = Math.floor((t - b) / per);
    a = b + k * per; b = a + per;
  }
  const per = b - a;
  if (!(per > 0.2) || per > 8) return null;
  const pos = (t - a) / per * 8;
  return { index: ((Math.floor(pos) % 8) + 8) % 8, phase: pos - Math.floor(pos), period: per };
}

/* Distancia (con signo) del instante t al "1" más cercano.
   Negativo = te adelantaste. Positivo = te atrasaste. */
function nearestOne(db, t) {
  if (!db || db.length < 2) return null;
  const n = db.length;

  // Antes del primer golpe o después del último: extrapolar con el compás del borde
  if (t <= db[0]) {
    const per = db[1] - db[0];
    const k = Math.round((t - db[0]) / per);
    const target = db[0] + k * per;
    return { err: t - target, per };
  }
  if (t >= db[n - 1]) {
    const per = db[n - 1] - db[n - 2];
    const k = Math.round((t - db[n - 1]) / per);
    const target = db[n - 1] + k * per;
    return { err: t - target, per };
  }

  // Dentro del tramo marcado: el "1" real es el golpe del profesor más cercano
  let best = null, idx = 0;
  for (let i = 0; i < n; i++) {
    const e = t - db[i];
    if (!best || Math.abs(e) < Math.abs(best.err)) { best = { err: e }; idx = i; }
  }
  const per = idx < n - 1 ? db[idx + 1] - db[idx] : db[idx] - db[idx - 1];
  best.per = per;
  return best;
}

  if (!teacher.active) return;
  const t = teacher.listener.time;
  const last = teacher.downbeats[teacher.downbeats.length - 1];
  if (last !== undefined && t - last < 0.35) return;   // rebote
  teacher.downbeats.push(t);

  const z = $("p-tap");
  z.classList.add("hit");
  setTimeout(() => z.classList.remove("hit"), 90);
  if (navigator.vibrate) navigator.vibrate(12);

  const n = teacher.downbeats.length;
  $("p-tapmain").textContent = t(n === 1 ? "tapCount" : "tapCountN", n);
  if (n >= 2) {
    const per = teacher.downbeats[n - 1] - teacher.downbeats[n - 2];
    $("p-taphint").textContent = t("bpmApprox", Math.round(60 / (per / 8)));
  }
}

const student = {
  listener: null, fp: null, song: null, offset: 0, syncAt: 0,
  voice: false, vibe: true, lastIdx: -1, matching: false, lastMatchTry: 0, forced: null
};

$("a-voice").addEventListener("click", (e) => {
  student.voice = !student.voice;
  e.target.textContent = "Voz: " + (student.voice ? "sí" : "no");
});
/* iOS no expone vibración a las páginas web: no es un permiso que se pueda
   pedir, la API directamente no existe. En vez de dejar un botón que no hace
   nada, lo desactivamos y explicamos por qué. */
const CAN_VIBRATE = typeof navigator.vibrate === "function";

function initVibe() {
  const b = $("a-vibe");
  if (CAN_VIBRATE) {
    student.vibe = true;
    b.textContent = t("vibrate") + ": " + t("yes");
    return;
  }
  student.vibe = false;
  b.textContent = t("vibeNA");
  b.disabled = true;
  b.title = t("vibeNAHint");
}

$("a-vibe").addEventListener("click", (e) => {
  if (!CAN_VIBRATE) return;
  student.vibe = !student.vibe;
  e.target.textContent = "Vibrar: " + (student.vibe ? "sí" : "no");
});

const buzz = (ms) => { if (student.vibe && CAN_VIBRATE) navigator.vibrate(ms); };

$("a-start").addEventListener("click", async () => {
  if (!songs.length) { setA(t("noSongs"), "err"); return; }

  student.fp = new Fingerprinter();
  student.song = null;
  student.lastIdx = -1;
  student.lastMatchTry = 0;
  student.listener = new Listener();

  try {
    await student.listener.start(onStudentFrame, (lvl) => {
      $("a-level").style.width = (lvl * 100) + "%";
    });
  } catch (e) {
    setA(t("micFail") + e.name, "err");
    return;
  }

  $("a-start").disabled = true;
  $("a-stop").disabled = false;
  setA(t("searching"));
});

$("a-stop").addEventListener("click", () => stopStudent());

function stopStudent() {
  if (student.listener) { student.listener.stop(); student.listener = null; }
  student.song = null;
  student.forced = null;
  $("a-start").disabled = false;
  $("a-stop").disabled = true;
  $("a-big").textContent = "·";
  $("a-big").className = "big";
  $("a-sub").textContent = "Sin escuchar";
  $("a-level").style.width = "0%";
  beatCells.forEach(c => c.classList.remove("on"));
}

function onStudentFrame(spec, frame, elapsed) {
  student.fp.push(spec, frame);

  // Reconocer al principio, y luego revalidar cada 10 s para corregir deriva
  const need = student.song ? 10 : 3.5;
  if (!student.matching && elapsed - student.lastMatchTry > need) {
    student.lastMatchTry = elapsed;
    tryMatch(elapsed);
  }

  if (student.song) paintStudent();
}

function tryMatch(elapsed) {
  student.matching = true;
  const { keys, times } = student.fp.result();
  // usar solo los últimos ~6 s de consulta
  const minFrame = Math.max(0, Math.floor((elapsed - 6) / FP.HOP));
  const qk = [], qt = [];
  for (let i = 0; i < keys.length; i++) {
    if (times[i] >= minFrame) { qk.push(keys[i]); qt.push(times[i]); }
  }

  const res = matcher.match(qk, qt);
  student.matching = false;
  if (!res) {
    if (!student.song) setA(t("notYet"));
    return;
  }
  if (student.forced && res.songId !== student.forced) return;

  const song = matcher.songs.get(res.songId);
  const first = student.song === null;
  student.song = song;
  // tiempo de la canción = tiempo de escucha + desfase
  student.offset = res.offsetFrames * FP.HOP;

  if (first) {
    buildBeats(song.rhythm);
    setA(song.title + (song.artist ? " · " + song.artist : ""), "ok");
    $("a-sub").textContent = rhythmName(song.rhythm) +
      (song.teacher ? " · " + song.teacher : "");
  }
}

function paintStudent() {
  // En modo juego no se dibuja nada de la cuenta: ese es el punto del ejercicio.
  if (game.on) return;

  const songTime = student.listener.time + student.offset;
  const c = countAt(student.song.downbeats, songTime);
  if (!c) return;

  if (c.index !== student.lastIdx) {
    student.lastIdx = c.index;
    const labels = RHYTHMS[student.song.rhythm].labels;
    const big = $("a-big");
    big.textContent = labels[c.index];
    big.className = "big" + (isOne(c.index) ? " one" : isTap(c.index) ? " tap" : "");
    beatCells.forEach((cell, i) => cell.classList.toggle("on", i === c.index));

    buzz(isOne(c.index) ? 60 : 15);
    if (student.voice) speak(labels[c.index], isOne(c.index));
  }
}

/* Voz: un tono corto por cuenta (hablar números va con retraso en el móvil) */
function speak(label, one) {
  const ctx = student.listener && student.listener.ctx;
  if (!ctx) return;
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.frequency.value = one ? 1320 : (label === "TAP" ? 660 : 880);
  g.gain.setValueAtTime(one ? 0.3 : 0.14, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.06);
  o.connect(g); g.connect(ctx.destination);
  o.start(); o.stop(ctx.currentTime + 0.07);
}

function setA(msg, kind) {
  const el = $("a-status");
  el.textContent = msg;
  el.className = "status" + (kind ? " " + kind : "");
}

/* =========================================================================
   MODO JUEGO: marcar el uno a ciegas
   ========================================================================= */
const game = {
  on: false, taps: [], points: 0, hits: 0, streak: 0, best: 0, lastTap: 0
};

$("a-mode").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-m]");
  if (!b) return;
  for (const x of $("a-mode").children) x.setAttribute("aria-pressed", x === b);
  setGameMode(b.dataset.m === "juego");
});

function setGameMode(on) {
  game.on = on;
  $("a-guide").hidden = on;
  $("a-game").hidden = !on;
  if (on) {
    resetGame();
    setA(student.song
      ? t("gameReady")
      : t("gameWait"));
  } else {
    student.lastIdx = -1;
  }
}

function resetGame() {
  game.taps = []; game.points = 0; game.hits = 0; game.streak = 0; game.best = 0; game.lastTap = 0;
  $("g-points").textContent = "0";
  $("g-hits").textContent = "0";
  $("g-streak").textContent = "0";
  $("g-verdict").textContent = "—";
  $("g-verdict").className = "verdict";
  $("g-offby").textContent = t("gameHint");
  $("g-result").hidden = true;
  $("g-finish").disabled = true;
  $("g-tapmain").textContent = t("gameTap");
  $("g-taphint").textContent = t("gameTapHint");
}

function gameTap() {
  if (!game.on) return;
  if (!student.song) { setA(t("notRecognised"), "err"); return; }

  const now = student.listener.time;
  if (now - game.lastTap < 0.25) return;          // rebote
  game.lastTap = now;

  const songTime = now + student.offset;
  const res = nearestOne(student.song.downbeats, songTime);
  if (!res) return;

  const band = judge(res.err);
  const ms = Math.round(res.err * 1000);

  game.taps.push({ err: res.err, band: band.name });
  game.points += band.pts;
  if (band.pts > 0) { game.hits++; game.streak++; game.best = Math.max(game.best, game.streak); }
  else game.streak = 0;

  const v = $("g-verdict");
  v.textContent = t(band.key);
  v.className = "verdict " + band.name + " pop";
  setTimeout(() => v.classList.remove("pop"), 110);

  $("g-offby").textContent = band.name === "perfecto"
    ? t("onTime")
    : (ms < 0 ? t("early", Math.abs(ms)) : t("late", ms));

  $("g-points").textContent = game.points;
  $("g-hits").textContent = game.hits;
  $("g-streak").textContent = game.streak;
  $("g-tapmain").textContent = t(game.taps.length === 1 ? "tapCount" : "tapCountN", game.taps.length);
  $("g-taphint").textContent = t("keepTapping");
  $("g-finish").disabled = game.taps.length < 4;

  buzz(band.pts > 0 ? 30 : 10);
  const z = $("g-tap");
  z.classList.add("hit");
  setTimeout(() => z.classList.remove("hit"), 90);
}

$("g-tap").addEventListener("pointerdown", (e) => { e.preventDefault(); gameTap(); });
$("g-again").addEventListener("click", () => resetGame());

$("g-finish").addEventListener("click", async () => {
  if (game.taps.length < 4) return;

  const n = game.taps.length;
  const avgErr = game.taps.reduce((s, t) => s + Math.abs(t.err), 0) / n;
  const maxPts = n * 100;
  const accuracy = Math.round(game.points / maxPts * 100);

  const grade =
    accuracy >= 85 ? t("gFlawless") :
    accuracy >= 70 ? t("gVeryGood") :
    accuracy >= 50 ? t("gOk") :
    accuracy >= 30 ? t("gPractise") : t("gRough");

  $("g-grade").textContent = grade;
  $("r-points").textContent = game.points;
  $("r-acc").textContent = accuracy + "%";
  $("r-err").textContent = Math.round(avgErr * 1000) + " ms";
  $("r-streak").textContent = game.best;

  // Consejo según la tendencia: adelantarse y atrasarse se corrigen distinto
  const bias = game.taps.reduce((s, t) => s + t.err, 0) / n;
  $("r-tip").textContent =
    Math.abs(bias) < 0.04 ? t("tipEven")
    : bias < 0 ? t("tipEarly", Math.round(Math.abs(bias) * 1000))
    : t("tipLate", Math.round(bias * 1000));

  $("g-result").hidden = false;

  const score = {
    id: "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
    songId: student.song.id,
    songTitle: student.song.title,
    rhythm: student.song.rhythm,
    when: Date.now(),
    taps: n, hits: game.hits, points: game.points,
    accuracy, avgError: Math.round(avgErr * 1000), best: game.best
  };
  try {
    await DB.put(score, "scores");
    await reloadScores();
  } catch (e) {
    setA(t("scoreFail") + e.message, "err");
  }
});

/* =========================================================================
   Listas de canciones
   ========================================================================= */
function renderLists() {
  const mk = (s, forStudent) => {
    const row = document.createElement("div");
    row.className = "song";

    const info = document.createElement("div");
    info.className = "info";
    const t = document.createElement("div");
    t.className = "t";
    t.textContent = s.title;
    const m = document.createElement("div");
    m.className = "m";
    m.textContent = [s.artist, rhythmName(s.rhythm), s.teacher, fmt(s.duration || 0)]
      .filter(Boolean).join(" · ");
    info.appendChild(t); info.appendChild(m);

    if (!usable(s)) {
      const w = document.createElement("div");
      w.className = "m";
      w.style.color = "#ff8a70";
      w.textContent = t("oldFormat");
      info.appendChild(w);
    }

    const btn = document.createElement("button");
    if (forStudent) {
      btn.textContent = t("onlyThis");
      btn.addEventListener("click", () => {
        student.forced = student.forced === s.id ? null : s.id;
        renderLists();
        setA(student.forced ? t("onlySearch") + s.title : t("anySong"));
      });
      if (student.forced === s.id) btn.style.borderColor = "var(--accent)";
    } else {
      btn.textContent = t("del");
      btn.addEventListener("click", async () => {
        await DB.del(s.id);
        await reload();
      });
    }

    row.appendChild(info); row.appendChild(btn);
    return row;
  };

  for (const [id, forStudent] of [["p-list", false], ["a-list", true]]) {
    const el = $(id);
    el.textContent = "";
    if (!songs.length) {
      const e = document.createElement("div");
      e.className = "empty";
      e.textContent = forStudent
        ? t("noSongsYet")
        : t("noneSaved");
      el.appendChild(e);
      continue;
    }
    songs.forEach(s => el.appendChild(mk(s, forStudent)));
  }
}

async function reloadScores() {
  const scores = (await DB.all("scores")).sort((a, b) => b.when - a.when).slice(0, 20);
  const el = $("a-scores");
  el.textContent = "";
  if (!scores.length) {
    const e = document.createElement("div");
    e.className = "empty";
    e.textContent = t("noScores");
    el.appendChild(e);
    return;
  }
  scores.forEach(s => {
    const row = document.createElement("div");
    row.className = "scorerow";

    const left = document.createElement("div");
    const t = document.createElement("div");
    t.className = "t";
    t.textContent = s.songTitle;
    const d = document.createElement("div");
    d.className = "d";
    d.textContent = new Date(s.when).toLocaleDateString() + " · " +
      s.hits + "/" + s.taps + " · " + s.avgError + " ms";
    left.appendChild(t); left.appendChild(d);

    const p = document.createElement("div");
    p.className = "p";
    p.textContent = s.accuracy + "%";

    row.appendChild(left); row.appendChild(p);
    el.appendChild(row);
  });
}

/* Las canciones sin marca de versión son de antes de que existiera el campo,
   y se hicieron con el algoritmo actual: cuentan como versión 1. */
const fpVersionOf = (s) => s.fpv || 1;
const usable = (s) => fpVersionOf(s) === FP.VERSION;

async function reload() {
  songs = await DB.all("songs");
  songs.sort((a, b) => b.createdAt - a.createdAt);
  matcher.clear();
  // Solo se indexan las que esta versión sabe comparar
  songs.filter(usable).forEach(s => matcher.add(s));
  renderLists();
  await reloadScores();

  const viejas = songs.filter(s => !usable(s)).length;
  if (viejas) {
    setA(t("oldFormatMsg", viejas), "err");
  }
}

/* =========================================================================
   Cambio de idioma en caliente
   ========================================================================= */
function applyLang() {
  document.documentElement.lang = lang;

  document.querySelectorAll("[data-i18n]").forEach(el => {
    const v = STR[lang][el.dataset.i18n];
    if (v !== undefined) el.textContent = v;
  });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => {
    const v = STR[lang][el.dataset.i18nPh];
    if (v !== undefined) el.placeholder = v;
  });

  for (const b of $("langsw").children) {
    b.setAttribute("aria-pressed", b.dataset.lang === lang);
  }

  // Botones cuyo texto lleva un estado dentro
  $("a-voice").textContent = t("voice") + ": " + t(student.voice ? "yes" : "no");
  if (CAN_VIBRATE) $("a-vibe").textContent = t("vibrate") + ": " + t(student.vibe ? "yes" : "no");
  else { $("a-vibe").textContent = t("vibeNA"); $("a-vibe").title = t("vibeNAHint"); }

  // Listas y textos generados
  if (DB.db) { renderLists(); reloadScores(); }
  if (!$("p-review").hidden && teacher.meta) renderReview();
  if (student.song) {
    $("a-sub").textContent = rhythmName(student.song.rhythm) +
      (student.song.teacher ? " · " + student.song.teacher : "");
  }
}

$("langsw").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-lang]");
  if (!b || b.dataset.lang === lang) return;
  lang = b.dataset.lang;
  localStorage.setItem("lang", lang);
  applyLang();
});

/* Expuesto para poder probar el algoritmo desde la consola sin micrófono. */
window.__cuentas = { Fingerprinter, Matcher, countAt, nearestOne, judge, FP, packHash };

/* =========================================================================
   Arranque
   ========================================================================= */
(async () => {
  initVibe();
  applyLang();
  try {
    await DB.open();
    await reload();
  } catch (e) {
    setP(t("dbFail") + e.message, "err");
  }
})();

})();
</script>
